<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Arial, Helvetica, sans-serif" fill="#1B1F24">
  <title>Behavioral patterns cheat sheet: strategy, observer, state</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#FFFFFF"/>

  <rect x="20" y="20" width="240" height="320" rx="8" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
  <rect x="280" y="20" width="240" height="320" rx="8" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
  <rect x="540" y="20" width="240" height="320" rx="8" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>

  <text x="140" y="50" font-size="16" font-weight="bold" text-anchor="middle">Strategy</text>
  <text x="140" y="70" font-size="13" text-anchor="middle">swap the algorithm</text>
  <rect x="60" y="95" width="160" height="44" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="140" y="123" font-size="14" font-weight="bold" text-anchor="middle">Caller</text>
  <rect x="40" y="185" width="200" height="56" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="140" y="209" font-size="14" font-weight="bold" text-anchor="middle">Backoff</text>
  <text x="140" y="228" font-size="13" text-anchor="middle">func(n int) Duration</text>
  <rect x="40" y="280" width="95" height="36" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="87" y="303" font-size="13" text-anchor="middle">Exponential</text>
  <rect x="145" y="280" width="95" height="36" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="192" y="303" font-size="13" text-anchor="middle">Fixed</text>

  <text x="400" y="50" font-size="16" font-weight="bold" text-anchor="middle">Observer</text>
  <text x="400" y="70" font-size="13" text-anchor="middle">one event, many listeners</text>
  <rect x="320" y="95" width="160" height="56" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="400" y="119" font-size="14" font-weight="bold" text-anchor="middle">Publisher</text>
  <text x="400" y="138" font-size="13" text-anchor="middle">topic to handlers</text>
  <rect x="290" y="260" width="70" height="40" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="325" y="285" font-size="13" text-anchor="middle">Sub A</text>
  <rect x="366" y="260" width="70" height="40" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="401" y="285" font-size="13" text-anchor="middle">Sub B</text>
  <rect x="442" y="260" width="70" height="40" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="477" y="285" font-size="13" text-anchor="middle">Sub C</text>

  <text x="660" y="50" font-size="16" font-weight="bold" text-anchor="middle">State</text>
  <text x="660" y="70" font-size="13" text-anchor="middle">behaviour follows the state</text>
  <rect x="580" y="95" width="160" height="56" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="660" y="119" font-size="14" font-weight="bold" text-anchor="middle">Machine</text>
  <text x="660" y="138" font-size="13" text-anchor="middle">state: paid</text>
  <rect x="560" y="190" width="200" height="56" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="660" y="214" font-size="14" font-weight="bold" text-anchor="middle">transitions table</text>
  <text x="660" y="233" font-size="13" text-anchor="middle">[state][event]</text>
  <rect x="580" y="280" width="160" height="36" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="660" y="303" font-size="13" text-anchor="middle">new state, or error</text>

  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="140" y1="139" x2="140" y2="183"/>
    <line x1="87" y1="280" x2="110" y2="243"/>
    <line x1="192" y1="280" x2="170" y2="243"/>
    <line x1="385" y1="151" x2="327" y2="258"/>
    <line x1="400" y1="151" x2="401" y2="258"/>
    <line x1="415" y1="151" x2="475" y2="258"/>
    <line x1="660" y1="151" x2="660" y2="188"/>
    <line x1="660" y1="246" x2="660" y2="278"/>
  </g>
  <text x="670" y="174" font-size="13">Handle(event)</text>

  <text x="16" y="372" font-size="13">Strategy: the caller picks. Observer: the publisher does not know its listeners. State: the table decides.</text>
</svg>
