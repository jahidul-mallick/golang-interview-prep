<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1B1F24">
<title>URL shortener: write path with ID generator and database, read path with cache and async click events</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="800" height="420" fill="#FFFFFF"/>
<text x="20" y="30" font-size="14" font-weight="bold">Write path: POST /urls</text>
<rect x="20" y="50" width="100" height="56" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="70" y="83" text-anchor="middle" font-size="14" font-weight="bold">Client</text>
<rect x="190" y="50" width="140" height="56" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="260" y="75" text-anchor="middle" font-size="14" font-weight="bold">Create API</text>
<text x="260" y="94" text-anchor="middle">validate, rate limit</text>
<rect x="400" y="50" width="170" height="56" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="485" y="75" text-anchor="middle" font-size="14" font-weight="bold">ID generator</text>
<text x="485" y="94" text-anchor="middle">key service + base62</text>
<rect x="650" y="135" width="130" height="70" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
<text x="715" y="165" text-anchor="middle" font-size="14" font-weight="bold">Database</text>
<text x="715" y="185" text-anchor="middle">code to long URL</text>
<line x1="120" y1="78" x2="188" y2="78" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="330" y1="78" x2="398" y2="78" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="570" y1="85" x2="680" y2="133" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<text x="630" y="98">store</text>
<text x="20" y="190" font-size="14" font-weight="bold">Read path: GET /abc1234 (most traffic)</text>
<rect x="20" y="210" width="100" height="56" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="70" y="243" text-anchor="middle" font-size="14" font-weight="bold">Client</text>
<rect x="190" y="210" width="140" height="56" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="260" y="235" text-anchor="middle" font-size="14" font-weight="bold">Redirect service</text>
<text x="260" y="254" text-anchor="middle">stateless</text>
<rect x="400" y="210" width="170" height="56" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
<text x="485" y="235" text-anchor="middle" font-size="14" font-weight="bold">Redis cache</text>
<text x="485" y="254" text-anchor="middle">cache-aside, TTL</text>
<line x1="120" y1="225" x2="188" y2="225" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="188" y1="252" x2="120" y2="252" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="288">302 + Location back to client</text>
<line x1="330" y1="238" x2="398" y2="238" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="570" y1="245" x2="680" y2="207" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<text x="610" y="243">miss</text>
<rect x="190" y="340" width="140" height="56" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
<text x="260" y="365" text-anchor="middle" font-size="14" font-weight="bold">Kafka</text>
<text x="260" y="384" text-anchor="middle">click events</text>
<rect x="400" y="340" width="170" height="56" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
<text x="485" y="365" text-anchor="middle" font-size="14" font-weight="bold">Analytics store</text>
<text x="485" y="384" text-anchor="middle">daily rollups</text>
<line x1="260" y1="266" x2="260" y2="338" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<text x="270" y="310">async, after response</text>
<line x1="330" y1="368" x2="398" y2="368" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
