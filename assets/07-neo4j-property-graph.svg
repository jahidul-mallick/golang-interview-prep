<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>A property graph: Account owns VPC, VPC contains Subnet, Subnet contains Instance, with the matching Cypher query</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="800" height="280" fill="#FFFFFF"/>

  <ellipse cx="95" cy="70" rx="60" ry="38" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="95" y="68" text-anchor="middle" font-weight="bold">:Account</text>
  <text x="95" y="87" font-size="13" text-anchor="middle">id: a1</text>

  <ellipse cx="295" cy="70" rx="60" ry="38" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="295" y="68" text-anchor="middle" font-weight="bold">:VPC</text>
  <text x="295" y="87" font-size="13" text-anchor="middle">cidr: 10.0/16</text>

  <ellipse cx="495" cy="70" rx="60" ry="38" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="495" y="68" text-anchor="middle" font-weight="bold">:Subnet</text>
  <text x="495" y="87" font-size="13" text-anchor="middle">az: a</text>

  <ellipse cx="695" cy="70" rx="60" ry="38" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="695" y="68" text-anchor="middle" font-weight="bold">:Instance</text>
  <text x="695" y="87" font-size="13" text-anchor="middle">type: m5</text>

  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="157" y1="70" x2="233" y2="70"/>
    <line x1="357" y1="70" x2="433" y2="70"/>
    <line x1="557" y1="70" x2="633" y2="70"/>
  </g>
  <text x="195" y="58" font-size="13" text-anchor="middle">OWNS</text>
  <text x="395" y="58" font-size="13" text-anchor="middle">CONTAINS</text>
  <text x="595" y="58" font-size="13" text-anchor="middle">CONTAINS</text>

  <text x="400" y="140" font-size="13" text-anchor="middle">Nodes are nouns with a label and properties. Relationships are typed, directed verbs.</text>

  <rect x="30" y="160" width="740" height="95" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="400" y="187" font-weight="bold" text-anchor="middle">All instances of one account</text>
  <text x="400" y="212" text-anchor="middle">MATCH (:Account {id: $id})-[:OWNS]-&gt;(:VPC)-[:CONTAINS]-&gt;(:Subnet)</text>
  <text x="400" y="234" text-anchor="middle">-[:CONTAINS]-&gt;(i:Instance) RETURN i</text>
</svg>
