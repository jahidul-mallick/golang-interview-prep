<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="Arial, Helvetica, sans-serif">
  <title>HTTP middleware chain: request goes inward, response comes back outward</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="800" height="280" fill="#FFFFFF"/>
  <text x="400" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B1F24">Chain(mux, logging, recoverer, auth)</text>

  <rect x="15" y="90" width="100" height="60" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="65" y="125" font-size="14" text-anchor="middle" fill="#1B1F24">Client</text>

  <rect x="165" y="90" width="120" height="60" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="225" y="115" font-size="14" text-anchor="middle" fill="#1B1F24">logging</text>
  <text x="225" y="134" font-size="13" text-anchor="middle" fill="#1B1F24">outermost</text>

  <rect x="335" y="90" width="120" height="60" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="395" y="115" font-size="14" text-anchor="middle" fill="#1B1F24">recoverer</text>
  <text x="395" y="134" font-size="13" text-anchor="middle" fill="#1B1F24">catches panic</text>

  <rect x="505" y="90" width="120" height="60" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="565" y="115" font-size="14" text-anchor="middle" fill="#1B1F24">auth</text>
  <text x="565" y="134" font-size="13" text-anchor="middle" fill="#1B1F24">may stop here</text>

  <rect x="675" y="90" width="110" height="60" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="730" y="115" font-size="14" text-anchor="middle" fill="#1B1F24">Handler</text>
  <text x="730" y="134" font-size="13" text-anchor="middle" fill="#1B1F24">business code</text>

  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="115" y1="110" x2="163" y2="110"/>
    <line x1="285" y1="110" x2="333" y2="110"/>
    <line x1="455" y1="110" x2="503" y2="110"/>
    <line x1="625" y1="110" x2="673" y2="110"/>
  </g>
  <text x="400" y="75" font-size="14" text-anchor="middle" fill="#1B1F24">request goes in, left to right</text>

  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M730,150 L730,190 L65,190 L65,152"/>
  </g>
  <text x="400" y="212" font-size="14" text-anchor="middle" fill="#1B1F24">response comes back out, right to left (logging sees the final status)</text>

  <rect x="165" y="228" width="460" height="34" rx="8" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="395" y="250" font-size="14" text-anchor="middle" fill="#1B1F24">auth returns 401 without calling next: the handler never runs</text>
</svg>
