<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>One BST visited in preorder, inorder, postorder and level order</title>
  <rect width="800" height="320" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <text x="400" y="28" font-size="16" font-weight="bold" text-anchor="middle">Same BST, four visiting orders</text>

  <g stroke="#555555" stroke-width="1.5" marker-end="url(#a)" fill="none">
    <line x1="190" y1="86" x2="120" y2="134"/>
    <line x1="210" y1="86" x2="280" y2="134"/>
    <line x1="102" y1="166" x2="78" y2="214"/>
    <line x1="118" y1="166" x2="152" y2="214"/>
    <line x1="282" y1="166" x2="248" y2="214"/>
    <line x1="298" y1="166" x2="322" y2="214"/>
  </g>
  <g stroke-width="2" text-anchor="middle" font-size="16">
    <circle cx="200" cy="70" r="18" fill="#E8F1FF" stroke="#2F6FDE"/><text x="200" y="76" stroke="none">4</text>
    <circle cx="110" cy="150" r="18" fill="#FFF3D6" stroke="#E0A100"/><text x="110" y="156" stroke="none">2</text>
    <circle cx="290" cy="150" r="18" fill="#FFF3D6" stroke="#E0A100"/><text x="290" y="156" stroke="none">6</text>
    <circle cx="70" cy="232" r="18" fill="#E3F6E5" stroke="#2E9E44"/><text x="70" y="238" stroke="none">1</text>
    <circle cx="160" cy="232" r="18" fill="#E3F6E5" stroke="#2E9E44"/><text x="160" y="238" stroke="none">3</text>
    <circle cx="240" cy="232" r="18" fill="#E3F6E5" stroke="#2E9E44"/><text x="240" y="238" stroke="none">5</text>
    <circle cx="330" cy="232" r="18" fill="#E3F6E5" stroke="#2E9E44"/><text x="330" y="238" stroke="none">7</text>
  </g>

  <line x1="400" y1="45" x2="400" y2="295" stroke="#cccccc" stroke-width="1"/>

  <g font-size="14">
    <text x="440" y="70" font-weight="bold">Preorder: node, left, right</text>
    <text x="440" y="94">4 2 1 3 6 5 7</text>
    <text x="440" y="136" font-weight="bold">Inorder: left, node, right</text>
    <text x="440" y="160">1 2 3 4 5 6 7 (sorted for a BST)</text>
    <text x="440" y="202" font-weight="bold">Postorder: left, right, node</text>
    <text x="440" y="226">1 3 2 5 7 6 4</text>
    <text x="440" y="268" font-weight="bold">Level order: queue, level by level</text>
    <text x="440" y="292">4 2 6 1 3 5 7</text>
  </g>
</svg>
