<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Arial, Helvetica, sans-serif">
  <title>mTLS between two pods using sidecar proxies</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E9E44"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#FFFFFF"/>

  <rect x="20" y="50" width="300" height="150" rx="10" fill="#F6F8FA" stroke="#555" stroke-width="2"/>
  <text x="170" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B1F24">Pod: orders</text>
  <rect x="40" y="100" width="110" height="80" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="95" y="135" font-size="14" text-anchor="middle" fill="#1B1F24">Go app</text>
  <text x="95" y="155" font-size="13" text-anchor="middle" fill="#1B1F24">plain HTTP</text>
  <rect x="190" y="100" width="110" height="80" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="245" y="135" font-size="14" text-anchor="middle" fill="#1B1F24">Sidecar</text>
  <text x="245" y="155" font-size="13" text-anchor="middle" fill="#1B1F24">Envoy proxy</text>

  <rect x="480" y="50" width="300" height="150" rx="10" fill="#F6F8FA" stroke="#555" stroke-width="2"/>
  <text x="630" y="75" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B1F24">Pod: payments</text>
  <rect x="500" y="100" width="110" height="80" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="555" y="135" font-size="14" text-anchor="middle" fill="#1B1F24">Sidecar</text>
  <text x="555" y="155" font-size="13" text-anchor="middle" fill="#1B1F24">Envoy proxy</text>
  <rect x="650" y="100" width="110" height="80" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="705" y="135" font-size="14" text-anchor="middle" fill="#1B1F24">Go app</text>
  <text x="705" y="155" font-size="13" text-anchor="middle" fill="#1B1F24">plain HTTP</text>

  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="150" y1="140" x2="188" y2="140"/>
    <line x1="610" y1="140" x2="648" y2="140"/>
  </g>
  <g stroke="#2E9E44" stroke-width="3" fill="none" marker-start="url(#b)" marker-end="url(#b)">
    <line x1="300" y1="140" x2="500" y2="140"/>
  </g>
  <text x="400" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B1F24">mTLS</text>
  <text x="400" y="162" font-size="13" text-anchor="middle" fill="#1B1F24">both sides show certs</text>

  <rect x="260" y="235" width="280" height="70" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="400" y="260" font-size="14" text-anchor="middle" fill="#1B1F24">Control plane (Istio) / CA</text>
  <text x="400" y="282" font-size="13" text-anchor="middle" fill="#1B1F24">issues and rotates the certificates</text>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="6 4">
    <line x1="330" y1="235" x2="260" y2="182"/>
    <line x1="470" y1="235" x2="540" y2="182"/>
  </g>
</svg>
