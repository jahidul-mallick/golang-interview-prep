<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960" font-family="Arial, Helvetica, sans-serif" fill="#1B1F24">
  <title>Go program lifecycle from source to exit</title>
  <rect x="0" y="0" width="800" height="960" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- arrows -->
  <g stroke="#555555" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="428" y1="84" x2="428" y2="104"/>
    <line x1="428" y1="168" x2="428" y2="188"/>
    <line x1="428" y1="314" x2="428" y2="334"/>
    <line x1="428" y1="414" x2="428" y2="434"/>
    <line x1="428" y1="498" x2="428" y2="518"/>
  </g>

  <!-- 1 -->
  <rect x="76" y="20" width="704" height="64" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="96" y="46" font-size="16" font-weight="bold">go build / go run</text>
  <text x="96" y="68" font-size="14">Compile the packages, then link them into one binary.</text>
  <circle cx="40" cy="52" r="16" fill="#2F6FDE"/>
  <text x="40" y="58" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- 2 -->
  <rect x="76" y="104" width="704" height="64" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="96" y="130" font-size="16" font-weight="bold">Process start</text>
  <text x="96" y="152" font-size="14">The Go runtime sets up the heap, scheduler and GC before your code runs.</text>
  <circle cx="40" cy="136" r="16" fill="#2F6FDE"/>
  <text x="40" y="142" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- 3 -->
  <rect x="76" y="188" width="704" height="126" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="96" y="214" font-size="16" font-weight="bold">Package initialisation</text>
  <text x="96" y="238" font-size="14">Imported packages first: dependencies before dependents.</text>
  <text x="96" y="260" font-size="14">Inside each package: package-level variables in dependency order,</text>
  <text x="96" y="282" font-size="14">then its init() functions (several allowed, in the order the files are</text>
  <text x="96" y="304" font-size="14">presented to the compiler, usually file name order).</text>
  <circle cx="40" cy="251" r="16" fill="#2F6FDE"/>
  <text x="40" y="257" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- 4 -->
  <rect x="76" y="334" width="704" height="80" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="96" y="360" font-size="16" font-weight="bold">main package last</text>
  <text x="96" y="384" font-size="14">Its variables, then its init() functions, then main.main().</text>
  <text x="96" y="404" font-size="14">Same rule as every other package, it just goes last.</text>
  <circle cx="40" cy="374" r="16" fill="#2F6FDE"/>
  <text x="40" y="380" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- 5 -->
  <rect x="76" y="434" width="704" height="64" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="96" y="460" font-size="16" font-weight="bold">main runs</text>
  <text x="96" y="482" font-size="14">Other goroutines you started run concurrently with it.</text>
  <circle cx="40" cy="466" r="16" fill="#2E9E44"/>
  <text x="40" y="472" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>

  <!-- 6 -->
  <rect x="76" y="518" width="704" height="86" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="96" y="544" font-size="16" font-weight="bold">main returns (or os.Exit)</text>
  <text x="96" y="568" font-size="14">The program exits immediately, even if other goroutines are still running.</text>
  <text x="96" y="588" font-size="14">Deferred functions of other goroutines do not run.</text>
  <circle cx="40" cy="561" r="16" fill="#E0A100"/>
  <text x="40" y="567" font-size="16" font-weight="bold" fill="#1B1F24" text-anchor="middle">6</text>

  <!-- 7 -->
  <rect x="76" y="634" width="704" height="86" rx="8" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="96" y="660" font-size="16" font-weight="bold">Other ways to end: panic not recovered, or os.Exit(n)</text>
  <text x="96" y="684" font-size="14">An unrecovered panic prints a stack trace and exits with code 2.</text>
  <text x="96" y="704" font-size="14">os.Exit(n) exits with code n and skips deferred functions.</text>
  <circle cx="40" cy="677" r="16" fill="#D13B3B"/>
  <text x="40" y="683" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>

  <!-- side note -->
  <rect x="76" y="744" width="704" height="76" rx="8" fill="#FFFFFF" stroke="#E0A100" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="96" y="770" font-size="16" font-weight="bold">Side note</text>
  <text x="96" y="792" font-size="14">init() cannot be called or referenced by your code.</text>
  <text x="96" y="810" font-size="14">import _ "pkg" runs only that package's initialisation.</text>

  <!-- remember -->
  <rect x="76" y="844" width="704" height="96" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="96" y="870" font-size="16" font-weight="bold">Remember</text>
  <text x="96" y="894" font-size="14">Dependencies initialise first, and each package is initialised once.</text>
  <text x="96" y="914" font-size="14">When main returns the process ends, so wait for goroutines yourself</text>
  <text x="96" y="932" font-size="14">(WaitGroup, channel, context) if their work must finish.</text>
</svg>
