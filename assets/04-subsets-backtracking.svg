<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>Backtracking recursion tree for subsets of [1,2,3]: each node is one saved subset</title>
  <rect width="800" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <text x="400" y="28" font-size="16" font-weight="bold" text-anchor="middle">Subsets of [1,2,3]: choose, recurse with i+1, un-choose</text>

  <g stroke="#555555" stroke-width="1.5" marker-end="url(#a)" fill="none">
    <line x1="400" y1="93" x2="200" y2="137"/>
    <line x1="400" y1="93" x2="450" y2="137"/>
    <line x1="400" y1="93" x2="650" y2="137"/>
    <line x1="200" y1="173" x2="130" y2="217"/>
    <line x1="200" y1="173" x2="280" y2="217"/>
    <line x1="450" y1="173" x2="450" y2="217"/>
    <line x1="130" y1="253" x2="130" y2="297"/>
  </g>
  <g fill="#ffffff" stroke="none">
    <rect x="286" y="105" width="28" height="18"/>
    <rect x="411" y="105" width="28" height="18"/>
    <rect x="511" y="105" width="28" height="18"/>
    <rect x="151" y="185" width="28" height="18"/>
    <rect x="226" y="185" width="28" height="18"/>
    <rect x="436" y="185" width="28" height="18"/>
    <rect x="116" y="265" width="28" height="18"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="300" y="119">+1</text>
    <text x="425" y="119">+2</text>
    <text x="525" y="119">+3</text>
    <text x="165" y="199">+2</text>
    <text x="240" y="199">+3</text>
    <text x="450" y="199">+3</text>
    <text x="130" y="279">+3</text>
  </g>
  <g stroke-width="2" text-anchor="middle">
    <rect x="360" y="57" width="80" height="36" rx="6" fill="#E8F1FF" stroke="#2F6FDE"/><text x="400" y="80" stroke="none">[ ]</text>
    <rect x="160" y="137" width="80" height="36" rx="6" fill="#FFF3D6" stroke="#E0A100"/><text x="200" y="160" stroke="none">[1]</text>
    <rect x="410" y="137" width="80" height="36" rx="6" fill="#FFF3D6" stroke="#E0A100"/><text x="450" y="160" stroke="none">[2]</text>
    <rect x="610" y="137" width="80" height="36" rx="6" fill="#FFF3D6" stroke="#E0A100"/><text x="650" y="160" stroke="none">[3]</text>
    <rect x="90" y="217" width="80" height="36" rx="6" fill="#E3F6E5" stroke="#2E9E44"/><text x="130" y="240" stroke="none">[1,2]</text>
    <rect x="240" y="217" width="80" height="36" rx="6" fill="#E3F6E5" stroke="#2E9E44"/><text x="280" y="240" stroke="none">[1,3]</text>
    <rect x="410" y="217" width="80" height="36" rx="6" fill="#E3F6E5" stroke="#2E9E44"/><text x="450" y="240" stroke="none">[2,3]</text>
    <rect x="90" y="297" width="80" height="36" rx="6" fill="#FDE7E7" stroke="#D13B3B"/><text x="130" y="320" stroke="none">[1,2,3]</text>
  </g>
  <text x="560" y="262">Every node is saved as a subset</text>
  <text x="560" y="286">8 nodes = 2^3 subsets</text>
  <text x="560" y="310">Edge = number chosen</text>
</svg>
