<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 395" width="800" height="395" font-family="Arial, Helvetica, sans-serif" fill="#1B1F24">
  <title>Linked list reversal: one step with prev, cur and next</title>
  <rect x="0" y="0" width="800" height="395" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D13B3B"/>
    </marker>
  </defs>

  <text x="400" y="30" font-size="16" font-weight="bold" text-anchor="middle">One step: next = cur.Next; cur.Next = prev; prev = cur; cur = next</text>

  <!-- Before -->
  <text x="30" y="62" font-size="14" font-weight="bold">Before</text>
  <rect x="30" y="75" width="60" height="50" rx="6" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="60" y="106" font-size="16" text-anchor="middle">nil</text>
  <rect x="150" y="75" width="90" height="50" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <rect x="300" y="75" width="90" height="50" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <rect x="450" y="75" width="90" height="50" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <rect x="600" y="75" width="90" height="50" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <g font-size="20" text-anchor="middle">
    <text x="195" y="107">1</text>
    <text x="345" y="107">2</text>
    <text x="495" y="107">3</text>
    <text x="645" y="107">4</text>
  </g>
  <line x1="240" y1="100" x2="298" y2="100" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="100" x2="448" y2="100" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="100" x2="598" y2="100" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="100" x2="733" y2="100" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="738" y="105" font-size="14">nil</text>
  <line x1="60" y1="180" x2="60" y2="129" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="195" y1="180" x2="195" y2="129" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="180" x2="345" y2="129" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="60" y="200">prev</text>
    <text x="195" y="200">cur</text>
    <text x="345" y="200">next</text>
  </g>

  <!-- After -->
  <text x="30" y="227" font-size="14" font-weight="bold">After</text>
  <rect x="30" y="240" width="60" height="50" rx="6" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="60" y="271" font-size="16" text-anchor="middle">nil</text>
  <rect x="150" y="240" width="90" height="50" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <rect x="300" y="240" width="90" height="50" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <rect x="450" y="240" width="90" height="50" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <rect x="600" y="240" width="90" height="50" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <g font-size="20" text-anchor="middle">
    <text x="195" y="272">1</text>
    <text x="345" y="272">2</text>
    <text x="495" y="272">3</text>
    <text x="645" y="272">4</text>
  </g>
  <line x1="148" y1="265" x2="92" y2="265" stroke="#D13B3B" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="390" y1="265" x2="448" y2="265" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="265" x2="598" y2="265" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="265" x2="733" y2="265" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="738" y="270" font-size="14">nil</text>
  <line x1="195" y1="345" x2="195" y2="294" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="345" x2="345" y2="294" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="495" y1="345" x2="495" y2="294" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="195" y="365">prev</text>
    <text x="345" y="365">cur</text>
    <text x="495" y="365">next</text>
  </g>

  <text x="400" y="387" font-size="14" text-anchor="middle">Red arrow: node 1 now points back. Save next first, or the rest of the list is lost.</text>
</svg>
