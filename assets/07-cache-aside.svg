<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Arial, Helvetica, sans-serif">
  <title>Cache-aside read and write flow with Redis and the database</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#FFFFFF"/>

  <rect x="30" y="120" width="150" height="70" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="105" y="150" font-size="14" text-anchor="middle" fill="#1B1F24">Go service</text>
  <text x="105" y="170" font-size="13" text-anchor="middle" fill="#1B1F24">app owns the logic</text>

  <rect x="320" y="40" width="160" height="70" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="400" y="70" font-size="14" text-anchor="middle" fill="#1B1F24">Redis cache</text>
  <text x="400" y="90" font-size="13" text-anchor="middle" fill="#1B1F24">key + TTL</text>

  <rect x="320" y="200" width="160" height="70" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="400" y="230" font-size="14" text-anchor="middle" fill="#1B1F24">Database</text>
  <text x="400" y="250" font-size="13" text-anchor="middle" fill="#1B1F24">source of truth</text>

  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="170" y1="120" x2="318" y2="85"/>
    <line x1="170" y1="190" x2="318" y2="225"/>
  </g>
  <text x="130" y="95" font-size="13" fill="#1B1F24">1. GET key</text>
  <text x="205" y="248" font-size="13" fill="#1B1F24">2. miss: query</text>

  <rect x="560" y="40" width="225" height="100" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="672" y="66" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B1F24">Read</text>
  <text x="672" y="88" font-size="13" text-anchor="middle" fill="#1B1F24">hit: return cached value</text>
  <text x="672" y="108" font-size="13" text-anchor="middle" fill="#1B1F24">miss: read DB, then SET key</text>
  <text x="672" y="128" font-size="13" text-anchor="middle" fill="#1B1F24">with a TTL</text>

  <rect x="560" y="170" width="225" height="100" rx="8" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="672" y="196" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B1F24">Write</text>
  <text x="672" y="218" font-size="13" text-anchor="middle" fill="#1B1F24">update the DB first,</text>
  <text x="672" y="238" font-size="13" text-anchor="middle" fill="#1B1F24">then DEL the cache key</text>
  <text x="672" y="258" font-size="13" text-anchor="middle" fill="#1B1F24">(not update it)</text>

  <text x="400" y="305" font-size="14" text-anchor="middle" fill="#1B1F24">Many misses on one hot key at once: share one DB call (singleflight) and add TTL jitter</text>
</svg>
