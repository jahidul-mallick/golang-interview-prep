<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>The string "héllo" as 6 bytes and 5 runes</title>
  <rect width="800" height="340" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="30" y="30" font-weight="bold">s := "héllo"   (UTF-8)</text>

  <text x="20" y="100" font-weight="bold">bytes</text>
  <rect x="170" y="75" width="100" height="50" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="220" y="105" text-anchor="middle">0x68</text>
  <rect x="270" y="75" width="100" height="50" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="320" y="105" text-anchor="middle">0xC3</text>
  <rect x="370" y="75" width="100" height="50" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="420" y="105" text-anchor="middle">0xA9</text>
  <rect x="470" y="75" width="100" height="50" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="520" y="105" text-anchor="middle">0x6C</text>
  <rect x="570" y="75" width="100" height="50" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="620" y="105" text-anchor="middle">0x6C</text>
  <rect x="670" y="75" width="100" height="50" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="720" y="105" text-anchor="middle">0x6F</text>

  <path d="M220,125 L220,168" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M370,125 L370,168" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M520,125 L520,168" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M620,125 L620,168" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M720,125 L720,168" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="20" y="210" font-weight="bold">runes</text>
  <rect x="170" y="170" width="100" height="60" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="220" y="195" text-anchor="middle">'h'</text>
  <text x="220" y="216" text-anchor="middle">i = 0</text>
  <rect x="270" y="170" width="200" height="60" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="370" y="195" text-anchor="middle">'é'  (2 bytes)</text>
  <text x="370" y="216" text-anchor="middle">i = 1</text>
  <rect x="470" y="170" width="100" height="60" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="520" y="195" text-anchor="middle">'l'</text>
  <text x="520" y="216" text-anchor="middle">i = 3</text>
  <rect x="570" y="170" width="100" height="60" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="620" y="195" text-anchor="middle">'l'</text>
  <text x="620" y="216" text-anchor="middle">i = 4</text>
  <rect x="670" y="170" width="100" height="60" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="720" y="195" text-anchor="middle">'o'</text>
  <text x="720" y="216" text-anchor="middle">i = 5</text>

  <text x="30" y="270">len(s) = 6 (bytes).   utf8.RuneCountInString(s) = 5 (runes).</text>
  <text x="30" y="300">range s gives (byte index, rune): the index jumps from 1 to 3.</text>
  <text x="30" y="325">s[1] is the byte 0xC3, not 'é'. Slicing s[:2] cuts the character in half.</text>
</svg>
