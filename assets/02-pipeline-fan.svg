<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>Pipeline with fan-out to parallel workers and fan-in merge</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="340" fill="#FFFFFF"/>
  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold">Pipeline: gen, fan-out stage, fan-in merge, consumer</text>

  <rect x="15" y="110" width="110" height="70" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="70" y="140" text-anchor="middle" font-weight="bold">gen</text>
  <text x="70" y="161" text-anchor="middle">source stage</text>

  <line x1="125" y1="145" x2="172" y2="145" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="175" y="122" width="80" height="46" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="215" y="150" text-anchor="middle" font-weight="bold">in chan</text>

  <line x1="255" y1="138" x2="298" y2="85" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="255" y1="145" x2="298" y2="145" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="255" y1="152" x2="298" y2="205" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="60" width="130" height="50" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="365" y="90" text-anchor="middle" font-weight="bold">square #1</text>
  <rect x="300" y="120" width="130" height="50" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="365" y="150" text-anchor="middle" font-weight="bold">square #2</text>
  <rect x="300" y="180" width="130" height="50" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="365" y="210" text-anchor="middle" font-weight="bold">square #3</text>

  <line x1="430" y1="85" x2="478" y2="138" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="145" x2="478" y2="145" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="205" x2="478" y2="152" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="110" width="130" height="70" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="545" y="140" text-anchor="middle" font-weight="bold">merge</text>
  <text x="545" y="161" text-anchor="middle">fan-in</text>

  <line x1="610" y1="145" x2="652" y2="145" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="655" y="115" width="130" height="60" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="720" y="150" text-anchor="middle" font-weight="bold">consumer</text>

  <text x="365" y="258" text-anchor="middle" font-style="italic">fan-out: N readers on one channel</text>

  <rect x="15" y="275" width="385" height="50" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="207" y="305" text-anchor="middle">Each stage closes its own output, never its input</text>
  <rect x="415" y="275" width="370" height="50" rx="8" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="600" y="305" text-anchor="middle">cancel(): every send selects on ctx.Done()</text>
</svg>
