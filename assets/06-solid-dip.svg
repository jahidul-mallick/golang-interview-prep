<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>Dependency inversion: OrderService depends on the Notifier interface; email and fake implementations plug in</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#ffffff"/>
  <rect x="20" y="80" width="190" height="60" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="115" y="107" text-anchor="middle" font-weight="bold">OrderService</text>
  <text x="115" y="127" text-anchor="middle">(the consumer)</text>
  <rect x="320" y="40" width="190" height="140" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="415" y="85" text-anchor="middle" font-weight="bold">Notifier (interface)</text>
  <text x="415" y="112" text-anchor="middle">Notify(msg string)</text>
  <text x="415" y="145" text-anchor="middle">declared by the consumer</text>
  <rect x="620" y="40" width="160" height="60" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="700" y="67" text-anchor="middle" font-weight="bold">emailNotifier</text>
  <text x="700" y="87" text-anchor="middle">(production)</text>
  <rect x="620" y="120" width="160" height="60" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="700" y="147" text-anchor="middle" font-weight="bold">fakeNotifier</text>
  <text x="700" y="167" text-anchor="middle">(test)</text>
  <line x1="210" y1="110" x2="318" y2="110" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="264" y="100" text-anchor="middle">depends on</text>
  <line x1="620" y1="70" x2="512" y2="70" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="566" y="60" text-anchor="middle">implements</text>
  <line x1="620" y1="150" x2="512" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="566" y="140" text-anchor="middle">implements</text>
  <rect x="20" y="220" width="760" height="56" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="400" y="244" text-anchor="middle" font-weight="bold">main() picks the implementation</text>
  <text x="400" y="264" text-anchor="middle">NewOrderService(emailNotifier{})   or   NewOrderService(&amp;fakeNotifier{})</text>
</svg>
