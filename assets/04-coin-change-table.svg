<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>Coin change table for coins 1, 3, 4 and amount 6, filled left to right</title>
  <rect width="800" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <text x="400" y="28" font-size="16" font-weight="bold" text-anchor="middle">Coin change, coins [1, 3, 4]: dp[a] = min(dp[a-c]) + 1</text>

  <text x="72" y="82" text-anchor="end" font-size="13">amount a</text>
  <text x="72" y="120" text-anchor="end" font-size="13">min coins</text>
  <g font-size="13" text-anchor="middle">
    <text x="122" y="82">0</text>
    <text x="217" y="82">1</text>
    <text x="312" y="82">2</text>
    <text x="407" y="82">3</text>
    <text x="502" y="82">4</text>
    <text x="597" y="82">5</text>
    <text x="692" y="82">6</text>
  </g>
  <g stroke-width="2" text-anchor="middle" font-size="20">
    <rect x="80" y="90" width="85" height="50" rx="6" fill="#E8F1FF" stroke="#2F6FDE"/><text x="122" y="123" stroke="none">0</text>
    <rect x="175" y="90" width="85" height="50" rx="6" fill="#E3F6E5" stroke="#2E9E44"/><text x="217" y="123" stroke="none">1</text>
    <rect x="270" y="90" width="85" height="50" rx="6" fill="#E3F6E5" stroke="#2E9E44"/><text x="312" y="123" stroke="none">2</text>
    <rect x="365" y="90" width="85" height="50" rx="6" fill="#E3F6E5" stroke="#2E9E44"/><text x="407" y="123" stroke="none">1</text>
    <rect x="460" y="90" width="85" height="50" rx="6" fill="#E3F6E5" stroke="#2E9E44"/><text x="502" y="123" stroke="none">1</text>
    <rect x="555" y="90" width="85" height="50" rx="6" fill="#E3F6E5" stroke="#2E9E44"/><text x="597" y="123" stroke="none">2</text>
    <rect x="650" y="90" width="85" height="50" rx="6" fill="#FFF3D6" stroke="#E0A100"/><text x="692" y="123" stroke="none">2</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="597" y="158">coin 1</text>
    <text x="407" y="158">coin 3</text>
    <text x="312" y="158">coin 4</text>
  </g>
  <g stroke="#555555" stroke-width="1.5" marker-end="url(#a)" fill="none">
    <path d="M597,166 C597,215 672,215 672,144"/>
    <path d="M407,166 C407,250 692,250 692,144"/>
    <path d="M312,166 C312,285 712,285 712,144"/>
  </g>
  <g font-size="14">
    <text x="80" y="318">dp[6] = min( dp[5]+1, dp[3]+1, dp[2]+1 ) = min( 3, 2, 3 ) = 2</text>
    <text x="80" y="344">Best is 3 + 3. Greedy takes 4 + 1 + 1 = 3 coins, so it is wrong here.</text>
    <text x="80" y="370">Base: dp[0] = 0. Fill a = 1..6 in order. Time O(amount * coins), space O(amount).</text>
  </g>
</svg>
