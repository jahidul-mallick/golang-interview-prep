<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>Value receiver changes a copy, pointer receiver changes the original</title>
  <rect width="800" height="350" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <path d="M400,15 L400,335" fill="none" stroke="#C8CDD3" stroke-width="1"/>

  <text x="40" y="32" font-weight="bold">func (c Counter) Inc() { c.N++ }</text>
  <rect x="40" y="55" width="320" height="56" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="200" y="89" text-anchor="middle">caller: c = {N: 0}</text>
  <path d="M200,111 L200,165" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="212" y="143">whole struct copied</text>
  <rect x="40" y="168" width="320" height="56" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="200" y="202" text-anchor="middle">method's copy: c = {N: 1}</text>
  <path d="M200,224 L200,278" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="212" y="256">copy discarded on return</text>
  <rect x="40" y="281" width="320" height="50" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="200" y="311" text-anchor="middle">caller still has N = 0</text>

  <text x="440" y="32" font-weight="bold">func (c *Counter) Inc() { c.N++ }</text>
  <rect x="440" y="55" width="320" height="56" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="600" y="89" text-anchor="middle">caller: c = {N: 0}</text>
  <path d="M600,111 L600,165" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="143">only &amp;c is copied</text>
  <rect x="440" y="168" width="320" height="56" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="600" y="202" text-anchor="middle">method's c = pointer to caller's c</text>
  <path d="M600,224 L600,278" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="256">c.N++ writes through it</text>
  <rect x="440" y="281" width="320" height="50" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="600" y="311" text-anchor="middle">caller now has N = 1</text>
</svg>
