<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>Escape analysis decides stack or heap: values that outlive the function go to the heap</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#FFFFFF"/>

  <rect x="200" y="20" width="400" height="64" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="400" y="46" text-anchor="middle" font-weight="bold">Escape analysis (compile time)</text>
  <text x="400" y="68" text-anchor="middle">Does the address outlive the function?</text>

  <path d="M300,84 L200,146" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M500,84 L600,146" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="235" y="118" text-anchor="end" font-weight="bold">no</text>
  <text x="565" y="118" font-weight="bold">yes</text>

  <rect x="40" y="150" width="320" height="110" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="200" y="176" text-anchor="middle" font-weight="bold">Stack</text>
  <text x="200" y="202" text-anchor="middle">p := point{1, 2}</text>
  <text x="200" y="224" text-anchor="middle">used only inside the function</text>
  <text x="200" y="246" text-anchor="middle">no malloc, no GC work</text>

  <rect x="440" y="150" width="320" height="110" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="600" y="176" text-anchor="middle" font-weight="bold">Heap</text>
  <text x="600" y="202" text-anchor="middle">return &amp;point{1, 2}</text>
  <text x="600" y="224" text-anchor="middle">pointer used after the call returns</text>
  <text x="600" y="246" text-anchor="middle">allocated by the runtime allocator</text>

  <path d="M200,260 L200,306" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M600,260 L600,306" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="40" y="310" width="320" height="50" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="200" y="340" text-anchor="middle">freed automatically on return</text>
  <rect x="440" y="310" width="320" height="50" rx="8" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="600" y="340" text-anchor="middle">freed later by the garbage collector</text>

  <text x="400" y="396" text-anchor="middle">See the decisions: go build -gcflags='-m'</text>
</svg>
