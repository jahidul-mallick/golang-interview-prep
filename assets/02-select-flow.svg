<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>How select chooses: ready case at random, else default, else block</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="350" fill="#FFFFFF"/>

  <rect x="20" y="130" width="170" height="60" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="105" y="166" text-anchor="middle" font-weight="bold">select starts</text>
  <line x1="190" y1="160" x2="250" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="255" y="130" width="180" height="60" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="345" y="166" text-anchor="middle" font-weight="bold">Any case ready?</text>

  <line x1="435" y1="145" x2="525" y2="85" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="102" font-size="13">yes</text>
  <rect x="530" y="50" width="250" height="70" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="655" y="79" text-anchor="middle" font-weight="bold">Pick one at random</text>
  <text x="655" y="100" text-anchor="middle">no priority, run it</text>

  <line x1="345" y1="190" x2="345" y2="235" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="357" y="217" font-size="13">no</text>
  <rect x="255" y="240" width="180" height="60" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="345" y="276" text-anchor="middle" font-weight="bold">Is there a default?</text>

  <line x1="435" y1="255" x2="525" y2="225" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="231" font-size="13">yes</text>
  <rect x="530" y="180" width="250" height="70" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="655" y="209" text-anchor="middle" font-weight="bold">Run default</text>
  <text x="655" y="230" text-anchor="middle">select never blocks</text>

  <line x1="435" y1="285" x2="525" y2="305" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="311" font-size="13">no</text>
  <rect x="530" y="270" width="250" height="70" rx="8" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="655" y="299" text-anchor="middle" font-weight="bold">Block</text>
  <text x="655" y="320" text-anchor="middle">until a case is ready</text>
</svg>
