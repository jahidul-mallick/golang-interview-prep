<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>Data race on counter++ versus the same code guarded by a mutex</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="330" fill="#FFFFFF"/>

  <text x="200" y="28" text-anchor="middle" font-size="16" font-weight="bold">No lock: counter starts at 5</text>
  <text x="600" y="28" text-anchor="middle" font-size="16" font-weight="bold">With mutex: counter starts at 5</text>
  <line x1="400" y1="45" x2="400" y2="310" stroke="#BBBBBB" stroke-width="1"/>

  <text x="18" y="96" font-weight="bold">G1</text>
  <text x="18" y="176" font-weight="bold">G2</text>
  <rect x="50" y="60" width="170" height="60" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="135" y="86" text-anchor="middle">read 5</text>
  <text x="135" y="106" text-anchor="middle">write 6</text>
  <rect x="150" y="140" width="170" height="60" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="235" y="166" text-anchor="middle">read 5 (stale)</text>
  <text x="235" y="186" text-anchor="middle">write 6</text>
  <line x1="50" y1="218" x2="340" y2="218" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="236" text-anchor="middle" font-size="13">time</text>
  <rect x="50" y="250" width="290" height="56" rx="8" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="195" y="274" text-anchor="middle" font-weight="bold">counter = 6, expected 7</text>
  <text x="195" y="294" text-anchor="middle">one increment lost</text>

  <text x="418" y="96" font-weight="bold">G1</text>
  <text x="418" y="176" font-weight="bold">G2</text>
  <rect x="450" y="60" width="150" height="60" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="525" y="86" text-anchor="middle">Lock, read 5,</text>
  <text x="525" y="106" text-anchor="middle">write 6, Unlock</text>
  <rect x="450" y="140" width="150" height="60" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="525" y="175" text-anchor="middle">blocked on Lock</text>
  <rect x="610" y="140" width="170" height="60" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="695" y="166" text-anchor="middle">read 6</text>
  <text x="695" y="186" text-anchor="middle">write 7, Unlock</text>
  <line x1="450" y1="218" x2="780" y2="218" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="236" text-anchor="middle" font-size="13">time</text>
  <rect x="450" y="250" width="330" height="56" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="615" y="274" text-anchor="middle" font-weight="bold">counter = 7</text>
  <text x="615" y="294" text-anchor="middle">G2 saw G1's write</text>
</svg>
