<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>Panic unwinding the call stack until a deferred recover</title>
  <rect width="800" height="330" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="30" y="30" font-weight="bold">main() calls handler(), handler() calls work(), work() panics</text>
  <rect x="20" y="60" width="220" height="90" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="130" y="90" text-anchor="middle" font-weight="bold">main()</text>
  <text x="130" y="114" text-anchor="middle">continues normally</text>
  <text x="130" y="134" text-anchor="middle">(3)</text>
  <rect x="290" y="60" width="220" height="90" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-weight="bold">handler()</text>
  <text x="400" y="114" text-anchor="middle">defer func(){ recover() }</text>
  <text x="400" y="134" text-anchor="middle">(2) panic stops here</text>
  <rect x="560" y="60" width="220" height="90" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="670" y="90" text-anchor="middle" font-weight="bold">work()</text>
  <text x="670" y="114" text-anchor="middle">panic("boom")</text>
  <text x="670" y="134" text-anchor="middle">(1) its defers run</text>
  <path d="M560,105 L512,105" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M290,105 L242,105" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="30" y="200">1. The panic unwinds the stack, running each frame's deferred functions on the way up.</text>
  <text x="30" y="226">2. A deferred function that calls recover() directly stops the unwinding.</text>
  <text x="30" y="252">3. handler() returns to main() as if it had finished (set named results to report the error).</text>
  <text x="30" y="290">No recover on the way up: the process prints the stack trace and exits with code 2.</text>
</svg>
