<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" font-family="Arial, Helvetica, sans-serif" fill="#1B1F24">
  <title>Two pointers on a sorted array: compare the sum with the target and move L or R</title>
  <rect x="0" y="0" width="800" height="410" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <text x="400" y="32" font-size="18" font-weight="bold" text-anchor="middle">Two pointers: sorted array, find a pair with sum = 15</text>

  <!-- array cells -->
  <rect x="135" y="80" width="80" height="50" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <rect x="225" y="80" width="80" height="50" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <rect x="315" y="80" width="80" height="50" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <rect x="405" y="80" width="80" height="50" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <rect x="495" y="80" width="80" height="50" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <rect x="585" y="80" width="80" height="50" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <g font-size="20" text-anchor="middle">
    <text x="175" y="113">1</text>
    <text x="265" y="113">2</text>
    <text x="355" y="113">4</text>
    <text x="445" y="113">7</text>
    <text x="535" y="113">11</text>
    <text x="625" y="113">15</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="175" y="72">0</text>
    <text x="265" y="72">1</text>
    <text x="355" y="72">2</text>
    <text x="445" y="72">3</text>
    <text x="535" y="72">4</text>
    <text x="625" y="72">5</text>
  </g>

  <!-- pointers -->
  <line x1="175" y1="190" x2="175" y2="137" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="212" font-size="15" font-weight="bold" text-anchor="middle">L (left)</text>
  <line x1="625" y1="190" x2="625" y2="137" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="625" y="212" font-size="15" font-weight="bold" text-anchor="middle">R (right)</text>
  <text x="400" y="170" font-size="15" text-anchor="middle">sum = 1 + 15 = 16, compare with target 15</text>

  <!-- three rules -->
  <rect x="40" y="250" width="220" height="70" rx="8" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="150" y="278" font-size="15" font-weight="bold" text-anchor="middle">sum &gt; target</text>
  <text x="150" y="300" font-size="15" text-anchor="middle">move R left</text>

  <rect x="290" y="250" width="220" height="70" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="400" y="278" font-size="15" font-weight="bold" text-anchor="middle">sum &lt; target</text>
  <text x="400" y="300" font-size="15" text-anchor="middle">move L right</text>

  <rect x="540" y="250" width="220" height="70" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="650" y="278" font-size="15" font-weight="bold" text-anchor="middle">sum == target</text>
  <text x="650" y="300" font-size="15" text-anchor="middle">found (4 + 11)</text>

  <text x="400" y="365" font-size="15" text-anchor="middle">Needs sorted input. Pointers only move inwards: O(n) time, O(1) space.</text>
  <text x="400" y="388" font-size="15" text-anchor="middle">Loop: for l &lt; r { compare, then move one pointer }</text>
</svg>
