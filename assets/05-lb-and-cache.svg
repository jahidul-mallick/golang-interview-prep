<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1B1F24">
  <title>Load balancer in front of app servers, with a Redis cache and a database</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="320" fill="#FFFFFF"/>

  <rect x="20" y="115" width="100" height="60" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="70" y="150" text-anchor="middle">Clients</text>

  <rect x="160" y="115" width="110" height="60" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="215" y="140" text-anchor="middle">Load</text>
  <text x="215" y="160" text-anchor="middle">balancer</text>

  <rect x="330" y="40" width="130" height="50" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="395" y="70" text-anchor="middle">App server 1</text>
  <rect x="330" y="120" width="130" height="50" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="395" y="150" text-anchor="middle">App server 2</text>
  <rect x="330" y="200" width="130" height="50" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="395" y="230" text-anchor="middle">App server 3</text>

  <rect x="520" y="115" width="110" height="60" rx="6" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="575" y="140" text-anchor="middle">Redis</text>
  <text x="575" y="160" text-anchor="middle">cache</text>

  <rect x="700" y="115" width="80" height="60" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="740" y="150" text-anchor="middle">Database</text>

  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="120" y1="145" x2="158" y2="145"/>
    <line x1="270" y1="145" x2="328" y2="65"/>
    <line x1="270" y1="145" x2="328" y2="145"/>
    <line x1="270" y1="145" x2="328" y2="225"/>
    <line x1="460" y1="65" x2="518" y2="135"/>
    <line x1="460" y1="145" x2="518" y2="145"/>
    <line x1="460" y1="225" x2="518" y2="155"/>
    <line x1="630" y1="145" x2="698" y2="145"/>
  </g>
  <text x="664" y="135" text-anchor="middle">on miss</text>

  <text x="400" y="290" text-anchor="middle">Cache-aside: read the cache first; on a miss read the DB and fill the cache</text>
</svg>
