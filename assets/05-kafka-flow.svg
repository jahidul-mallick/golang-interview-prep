<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1B1F24">
  <title>Kafka flow: producer, partitioned topic, consumer group, dead-letter topic</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="410" fill="#FFFFFF"/>

  <rect x="20" y="130" width="120" height="60" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="80" y="156" text-anchor="middle">Producer</text>
  <text x="80" y="176" text-anchor="middle">key = order_id</text>

  <text x="215" y="30" font-weight="bold">Topic: orders</text>
  <rect x="215" y="45" width="190" height="50" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="310" y="76" text-anchor="middle">P0  [0] [1] [2] [3]</text>
  <rect x="215" y="135" width="190" height="50" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="310" y="166" text-anchor="middle">P1  [0] [1] [2]</text>
  <rect x="215" y="225" width="190" height="50" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="310" y="256" text-anchor="middle">P2  [0] [1]</text>

  <rect x="500" y="30" width="270" height="250" rx="8" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="515" y="52" font-weight="bold">Consumer group: billing</text>
  <rect x="560" y="70" width="150" height="50" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="635" y="101" text-anchor="middle">Consumer 1</text>
  <rect x="560" y="170" width="150" height="50" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="635" y="201" text-anchor="middle">Consumer 2</text>

  <rect x="545" y="340" width="180" height="50" rx="6" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="635" y="370" text-anchor="middle">DLQ topic</text>

  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="140" y1="160" x2="213" y2="70"/>
    <line x1="140" y1="160" x2="213" y2="160"/>
    <line x1="140" y1="160" x2="213" y2="250"/>
    <line x1="405" y1="70" x2="558" y2="95"/>
    <line x1="405" y1="160" x2="558" y2="190"/>
    <line x1="405" y1="250" x2="558" y2="205"/>
    <line x1="635" y1="280" x2="635" y2="338"/>
  </g>
  <text x="647" y="316">fails N times</text>

  <text x="20" y="330">Order is kept only inside one partition.</text>
  <text x="20" y="352">One partition goes to one consumer in a group.</text>
  <text x="20" y="374">Commit the offset after processing.</text>
</svg>
