<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Arial, Helvetica, sans-serif">
  <title>Three pillars of observability: logs, metrics, traces</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#FFFFFF"/>

  <rect x="5" y="115" width="155" height="80" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="82" y="150" font-size="14" text-anchor="middle" fill="#1B1F24">Go service</text>
  <text x="82" y="170" font-size="13" text-anchor="middle" fill="#1B1F24">slog, /metrics, spans</text>

  <rect x="260" y="30" width="230" height="70" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="375" y="55" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B1F24">Logs: what happened</text>
  <text x="375" y="78" font-size="13" text-anchor="middle" fill="#1B1F24">JSON lines with request_id</text>

  <rect x="260" y="130" width="230" height="70" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="375" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B1F24">Metrics: how much, how fast</text>
  <text x="375" y="178" font-size="13" text-anchor="middle" fill="#1B1F24">counter, gauge, histogram</text>

  <rect x="260" y="230" width="230" height="70" rx="8" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="375" y="255" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B1F24">Traces: where time went</text>
  <text x="375" y="278" font-size="13" text-anchor="middle" fill="#1B1F24">one trace id across services</text>

  <rect x="580" y="30" width="200" height="70" rx="8" fill="#F6F8FA" stroke="#555" stroke-width="2"/>
  <text x="680" y="70" font-size="14" text-anchor="middle" fill="#1B1F24">Loki / ELK</text>
  <rect x="580" y="130" width="200" height="70" rx="8" fill="#F6F8FA" stroke="#555" stroke-width="2"/>
  <text x="680" y="162" font-size="14" text-anchor="middle" fill="#1B1F24">Prometheus scrapes</text>
  <text x="680" y="182" font-size="13" text-anchor="middle" fill="#1B1F24">then Grafana, alerts</text>
  <rect x="580" y="230" width="200" height="70" rx="8" fill="#F6F8FA" stroke="#555" stroke-width="2"/>
  <text x="680" y="262" font-size="14" text-anchor="middle" fill="#1B1F24">Jaeger / Tempo</text>
  <text x="680" y="282" font-size="13" text-anchor="middle" fill="#1B1F24">(via OpenTelemetry)</text>

  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="160" y1="135" x2="258" y2="75"/>
    <line x1="160" y1="155" x2="258" y2="165"/>
    <line x1="160" y1="178" x2="258" y2="255"/>
    <line x1="490" y1="65" x2="578" y2="65"/>
    <line x1="490" y1="165" x2="578" y2="165"/>
    <line x1="490" y1="265" x2="578" y2="265"/>
  </g>
</svg>
