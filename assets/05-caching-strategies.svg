<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>Caching strategies: cache-aside, write-through and write-back</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#FFFFFF"/>

  <rect x="20" y="20" width="110" height="380" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="75" y="205" text-anchor="middle">App</text>

  <!-- Row 1: cache-aside -->
  <text x="160" y="28" font-weight="bold">Cache-aside (default)</text>
  <rect x="250" y="40" width="120" height="45" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="310" y="68" text-anchor="middle">Cache</text>
  <rect x="560" y="40" width="120" height="45" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="620" y="68" text-anchor="middle">Database</text>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="130" y1="62" x2="248" y2="62"/>
    <path d="M130,80 Q350,125 558,80"/>
  </g>
  <text x="140" y="55">1. read</text>
  <text x="360" y="112">2. on a miss, read DB and fill the cache</text>
  <text x="160" y="140">Simple. Stale window after a write, so delete the key.</text>

  <!-- Row 2: write-through -->
  <text x="160" y="178" font-weight="bold">Write-through</text>
  <rect x="250" y="190" width="120" height="45" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="310" y="218" text-anchor="middle">Cache</text>
  <rect x="560" y="190" width="120" height="45" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="620" y="218" text-anchor="middle">Database</text>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="130" y1="212" x2="248" y2="212"/>
    <line x1="370" y1="212" x2="558" y2="212"/>
  </g>
  <text x="145" y="205">1. write</text>
  <text x="390" y="205">2. write DB, then ack</text>
  <text x="160" y="270">Reads are fresh. Writes are slower; unread keys fill the cache.</text>

  <!-- Row 3: write-back -->
  <text x="160" y="308" font-weight="bold">Write-back</text>
  <rect x="250" y="320" width="120" height="45" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="310" y="348" text-anchor="middle">Cache</text>
  <rect x="560" y="320" width="120" height="45" rx="6" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="620" y="348" text-anchor="middle">Database</text>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="130" y1="342" x2="248" y2="342"/>
    <line x1="370" y1="342" x2="558" y2="342" stroke-dasharray="6 4"/>
  </g>
  <text x="145" y="335">1. write + ack</text>
  <text x="400" y="335">2. flush later (async)</text>
  <text x="160" y="400">Fastest writes. Data is lost if the cache dies before the flush.</text>
</svg>
