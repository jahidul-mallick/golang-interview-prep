<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>Alternate printing: two goroutines pass a token through two buffered channels</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="370" fill="#FFFFFF"/>
  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold">Alternate print: the token goes back and forth</text>

  <rect x="40" y="130" width="160" height="80" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="120" y="162" text-anchor="middle" font-weight="bold">Goroutine odd</text>
  <text x="120" y="184" text-anchor="middle">prints 1, 3, 5</text>
  <rect x="600" y="130" width="160" height="80" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="680" y="162" text-anchor="middle" font-weight="bold">Goroutine even</text>
  <text x="680" y="184" text-anchor="middle">prints 2, 4, 6</text>

  <rect x="330" y="55" width="140" height="55" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-weight="bold">evenCh</text>
  <text x="400" y="99" text-anchor="middle">cap 1</text>
  <rect x="330" y="230" width="140" height="55" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="400" y="255" text-anchor="middle" font-weight="bold">oddCh</text>
  <text x="400" y="274" text-anchor="middle">cap 1</text>

  <line x1="200" y1="140" x2="328" y2="85" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="212" y="100">send</text>
  <line x1="472" y1="85" x2="598" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="535" y="88">receive</text>
  <line x1="600" y1="200" x2="472" y2="255" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="278">send</text>
  <line x1="328" y1="255" x2="200" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="212" y="278">receive</text>

  <rect x="40" y="310" width="350" height="44" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="215" y="337" text-anchor="middle">Start: put one token in oddCh</text>
  <rect x="410" y="310" width="350" height="44" rx="8" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="585" y="337" text-anchor="middle">Cap 1: the last send cannot block</text>
</svg>
