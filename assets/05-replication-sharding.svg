<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1B1F24">
  <title>Primary with read replicas, and sharding by key</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="350" fill="#FFFFFF"/>

  <line x1="400" y1="20" x2="400" y2="330" stroke="#555" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="20" y="30" font-size="17" font-weight="bold">Replication</text>
  <rect x="130" y="70" width="150" height="56" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="205" y="94" text-anchor="middle">Primary</text>
  <text x="205" y="113" text-anchor="middle">(writes)</text>
  <rect x="30" y="220" width="150" height="56" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="105" y="244" text-anchor="middle">Replica 1</text>
  <text x="105" y="263" text-anchor="middle">(reads)</text>
  <rect x="230" y="220" width="150" height="56" rx="6" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="305" y="244" text-anchor="middle">Replica 2</text>
  <text x="305" y="263" text-anchor="middle">(reads)</text>

  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="205" y1="40" x2="205" y2="68"/>
    <line x1="170" y1="126" x2="110" y2="218"/>
    <line x1="240" y1="126" x2="300" y2="218"/>
    <line x1="105" y1="276" x2="105" y2="306"/>
    <line x1="305" y1="276" x2="305" y2="306"/>
  </g>
  <text x="215" y="56">writes</text>
  <text x="205" y="180" text-anchor="middle">async copy</text>
  <text x="105" y="326" text-anchor="middle">reads</text>
  <text x="305" y="326" text-anchor="middle">reads</text>

  <text x="420" y="30" font-size="17" font-weight="bold">Sharding</text>
  <rect x="430" y="125" width="140" height="60" rx="6" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="500" y="150" text-anchor="middle">Router</text>
  <text x="500" y="170" text-anchor="middle">hash(tenant_id)</text>
  <rect x="650" y="50" width="130" height="50" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="715" y="80" text-anchor="middle">Shard A</text>
  <rect x="650" y="130" width="130" height="50" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="715" y="160" text-anchor="middle">Shard B</text>
  <rect x="650" y="210" width="130" height="50" rx="6" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="715" y="240" text-anchor="middle">Shard C</text>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="570" y1="155" x2="648" y2="75"/>
    <line x1="570" y1="155" x2="648" y2="155"/>
    <line x1="570" y1="155" x2="648" y2="235"/>
  </g>
  <text x="420" y="300">Each shard has its own primary and replicas</text>
</svg>
