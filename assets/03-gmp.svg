<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
  <title>GMP scheduler: Ps with local run queues, a global queue, Ms as OS threads, work stealing</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="#FFFFFF"/>

  <rect x="250" y="20" width="300" height="56" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="400" y="45" text-anchor="middle" font-weight="bold">Global run queue</text>
  <text x="400" y="65" text-anchor="middle">new / overflow goroutines (G)</text>

  <rect x="40" y="140" width="320" height="90" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="200" y="165" text-anchor="middle" font-weight="bold">P0 (logical processor)</text>
  <text x="200" y="188" text-anchor="middle">local run queue (256 slots)</text>
  <text x="200" y="210" text-anchor="middle">runnext: G to run next</text>

  <rect x="440" y="140" width="320" height="90" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="600" y="165" text-anchor="middle" font-weight="bold">P1 (logical processor)</text>
  <text x="600" y="188" text-anchor="middle">local run queue (256 slots)</text>
  <text x="600" y="210" text-anchor="middle">runnext: G to run next</text>

  <rect x="40" y="290" width="320" height="56" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="200" y="314" text-anchor="middle" font-weight="bold">M0 (OS thread)</text>
  <text x="200" y="334" text-anchor="middle">runs the current G</text>

  <rect x="440" y="290" width="320" height="56" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="600" y="314" text-anchor="middle" font-weight="bold">M1 (OS thread)</text>
  <text x="600" y="334" text-anchor="middle">runs the current G</text>

  <rect x="120" y="390" width="560" height="44" rx="8" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <text x="400" y="418" text-anchor="middle">Blocking syscall: M blocks, P is handed to another M</text>

  <path d="M330,76 L220,138" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M470,76 L580,138" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="250" y="112" text-anchor="end">pull a batch</text>
  <path d="M440,185 L362,185" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="172" text-anchor="middle">steal half</text>
  <path d="M200,230 L200,288" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M600,230 L600,288" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="210" y="265">P needs an M to run</text>
  <path d="M200,346 L200,388" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>
