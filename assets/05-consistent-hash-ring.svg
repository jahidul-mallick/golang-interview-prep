<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1B1F24">
  <title>Consistent hash ring with three nodes, virtual nodes and keys</title>
  <defs>
    <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#E0A100"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="430" fill="#FFFFFF"/>

  <circle cx="260" cy="230" r="150" fill="none" stroke="#555" stroke-width="2"/>
  <text x="260" y="226" text-anchor="middle">Hash ring</text>
  <text x="260" y="246" text-anchor="middle">0 to 2^32</text>

  <g stroke="#E0A100" stroke-width="3" fill="none" marker-end="url(#g)">
    <path d="M397,169 A150,150 0 0 1 402,279"/>
    <path d="M244,379 A150,150 0 0 1 147,328"/>
    <path d="M139,142 A150,150 0 0 1 231,83"/>
  </g>

  <g fill="#E3F6E5" stroke="#2E9E44" stroke-width="2">
    <circle cx="335" cy="360" r="16"/>
    <circle cx="110" cy="230" r="16"/>
    <circle cx="335" cy="100" r="16"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="335" y="365">A'</text>
    <text x="110" y="235">B'</text>
    <text x="335" y="105">C'</text>
  </g>

  <g fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2">
    <circle cx="260" cy="80" r="22"/>
    <circle cx="390" cy="305" r="22"/>
    <circle cx="130" cy="305" r="22"/>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="260" y="86">A</text>
    <text x="390" y="311">B</text>
    <text x="130" y="311">C</text>
  </g>

  <g fill="#FFF3D6" stroke="#E0A100" stroke-width="2">
    <circle cx="390" cy="155" r="14"/>
    <circle cx="260" cy="380" r="14"/>
    <circle cx="130" cy="155" r="14"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="390" y="160">k1</text>
    <text x="260" y="385">k2</text>
    <text x="130" y="160">k3</text>
  </g>

  <rect x="490" y="50" width="280" height="80" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <text x="505" y="78" font-weight="bold">Rule</text>
  <text x="505" y="100">A key belongs to the first node</text>
  <text x="505" y="120">clockwise from it (k1 to B).</text>

  <rect x="490" y="160" width="280" height="100" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <text x="505" y="188" font-weight="bold">Add or remove a node</text>
  <text x="505" y="210">Only the keys next to it move,</text>
  <text x="505" y="230">about 1/N of all keys. Mod N</text>
  <text x="505" y="250">would move almost all of them.</text>

  <rect x="490" y="290" width="280" height="100" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="505" y="318" font-weight="bold">Virtual nodes (A', B', C')</text>
  <text x="505" y="340">Each node sits at many points,</text>
  <text x="505" y="360">so load spreads evenly and a</text>
  <text x="505" y="380">leaving node's keys are shared.</text>
</svg>
