<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 940" width="800" height="940" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1B1F24">
  <title>Reliable event processing from producer to consumer, with retries and a dead-letter topic</title>
  <rect x="0" y="0" width="800" height="940" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="16" font-weight="bold">Reliable event processing: producer to consumer</text>

  <!-- Arrows -->
  <g stroke="#555555" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="280" y1="138" x2="280" y2="167"/>
    <line x1="280" y1="246" x2="280" y2="275"/>
    <line x1="280" y1="336" x2="280" y2="365"/>
    <line x1="280" y1="426" x2="280" y2="455"/>
    <line x1="280" y1="534" x2="280" y2="563"/>
    <line x1="150" y1="624" x2="150" y2="667"/>
    <line x1="410" y1="624" x2="410" y2="667"/>
  </g>
  <text x="158" y="651">success</text>
  <text x="418" y="651">error or timeout</text>

  <!-- 1 -->
  <rect x="30" y="60" width="500" height="78" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <circle cx="55" cy="82" r="12" fill="#2F6FDE"/>
  <text x="55" y="87" text-anchor="middle" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="80" y="87" font-weight="bold">Producer service</text>
  <text x="80" y="108">Writes business data plus an "outbox" row in ONE DB transaction</text>
  <text x="80" y="127">(the data and the event are saved together or not at all)</text>

  <!-- 2 -->
  <rect x="30" y="168" width="500" height="78" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <circle cx="55" cy="190" r="12" fill="#2F6FDE"/>
  <text x="55" y="195" text-anchor="middle" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="80" y="195" font-weight="bold">Relay publishes outbox rows to the broker</text>
  <text x="80" y="216">Kafka topic, keyed by entity id: one key stays in one</text>
  <text x="80" y="235">partition, so its order is kept</text>

  <!-- 3 -->
  <rect x="30" y="276" width="500" height="60" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <circle cx="55" cy="298" r="12" fill="#2F6FDE"/>
  <text x="55" y="303" text-anchor="middle" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="80" y="303" font-weight="bold">Broker</text>
  <text x="80" y="324">Topic split into partitions, each partition replicated</text>

  <!-- 4 -->
  <rect x="30" y="366" width="500" height="60" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <circle cx="55" cy="388" r="12" fill="#2F6FDE"/>
  <text x="55" y="393" text-anchor="middle" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="80" y="393" font-weight="bold">Consumer group</text>
  <text x="80" y="414">Each partition is read by one consumer in the group</text>

  <!-- 5 -->
  <rect x="30" y="456" width="500" height="78" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <circle cx="55" cy="478" r="12" fill="#2F6FDE"/>
  <text x="55" y="483" text-anchor="middle" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="80" y="483" font-weight="bold">Idempotency check</text>
  <text x="80" y="504">Look up the event id in a processed-events table (or use a</text>
  <text x="80" y="523">unique constraint). Seen before? Skip it, duplicates are harmless</text>

  <!-- 6 -->
  <rect x="30" y="564" width="500" height="60" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
  <circle cx="55" cy="586" r="12" fill="#2F6FDE"/>
  <text x="55" y="591" text-anchor="middle" font-weight="bold" fill="#FFFFFF">6</text>
  <text x="80" y="591" font-weight="bold">Process the message with a timeout</text>
  <text x="80" y="612">A context timeout stops one slow message blocking the partition</text>

  <!-- 7 -->
  <rect x="30" y="668" width="240" height="162" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
  <circle cx="55" cy="690" r="12" fill="#2E9E44"/>
  <text x="55" y="695" text-anchor="middle" font-weight="bold" fill="#FFFFFF">7</text>
  <text x="76" y="695" font-weight="bold">Success: commit offset</text>
  <text x="44" y="718">Commit (or ack) AFTER</text>
  <text x="44" y="737">processing, not before.</text>
  <text x="44" y="756">If the consumer crashes</text>
  <text x="44" y="775">before the commit, the</text>
  <text x="44" y="794">message comes again: this</text>
  <text x="44" y="813">is at-least-once delivery.</text>

  <!-- 8 -->
  <rect x="290" y="668" width="240" height="162" rx="8" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
  <circle cx="315" cy="690" r="12" fill="#D13B3B"/>
  <text x="315" y="695" text-anchor="middle" font-weight="bold" fill="#FFFFFF">8</text>
  <text x="336" y="695" font-weight="bold">Failure: retry, then DLQ</text>
  <text x="304" y="718">Retry with backoff, a few</text>
  <text x="304" y="737">times. Still failing: send to</text>
  <text x="304" y="756">a retry or dead-letter topic</text>
  <text x="304" y="775">(DLQ) with the error. Alert,</text>
  <text x="304" y="794">then replay the messages</text>
  <text x="304" y="813">after the fix.</text>

  <!-- Side: delivery guarantees -->
  <rect x="555" y="60" width="215" height="292" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="569" y="87" font-weight="bold">Delivery guarantees</text>
  <text x="569" y="112" font-weight="bold">At-most-once</text>
  <text x="569" y="131">Commit before processing;</text>
  <text x="569" y="150">may lose messages.</text>
  <text x="569" y="179" font-weight="bold">At-least-once</text>
  <text x="569" y="198">Commit after processing;</text>
  <text x="569" y="217">may duplicate, so it needs</text>
  <text x="569" y="236">idempotency. Usual choice.</text>
  <text x="569" y="265" font-weight="bold">Exactly-once</text>
  <text x="569" y="284">Only in specific setups:</text>
  <text x="569" y="303">Kafka transactions inside</text>
  <text x="569" y="322">Kafka. End to end, use</text>
  <text x="569" y="341">idempotent consumers.</text>

  <!-- Side: watch -->
  <rect x="555" y="380" width="215" height="104" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
  <text x="569" y="407" font-weight="bold">Watch</text>
  <text x="569" y="432">Consumer lag</text>
  <text x="569" y="451">DLQ size</text>
  <text x="569" y="470">Processing latency</text>

  <!-- Note -->
  <rect x="30" y="854" width="740" height="62" rx="8" fill="#FFFFFF" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="44" y="880">NATS core is fire-and-forget (no persistence or acks); JetStream adds persistence and acks.</text>
  <text x="44" y="903">GCP Pub/Sub is at-least-once by default: unacked messages are redelivered after the ack deadline.</text>
</svg>
