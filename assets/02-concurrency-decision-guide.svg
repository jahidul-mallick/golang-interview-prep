<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1B1F24">
<title>Choosing a Go concurrency primitive: decision flow</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="800" height="1000" fill="#FFFFFF"/>
<rect x="40" y="20" width="320" height="44" rx="8" fill="#FFF3D6" stroke="#E0A100" stroke-width="2"/>
<text x="200" y="48" text-anchor="middle" font-size="16" font-weight="bold">What do I need?</text>
<line x1="200" y1="64" x2="200" y2="88" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="90" width="320" height="66" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="200" y="120" text-anchor="middle">Hand data or ownership to another</text>
<text x="200" y="140" text-anchor="middle">goroutine, or signal an event?</text>
<line x1="360" y1="123" x2="428" y2="123" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="372" y="116" font-size="13">yes</text>
<rect x="430" y="90" width="340" height="66" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
<text x="600" y="119" text-anchor="middle" font-weight="bold">channel</text>
<text x="600" y="137" text-anchor="middle">Sender closes it, never the receiver</text>
<line x1="200" y1="156" x2="200" y2="178" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="172" font-size="13">no</text>
<rect x="40" y="180" width="320" height="66" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="200" y="210" text-anchor="middle">Protect shared state?</text>
<text x="200" y="230" text-anchor="middle">(several goroutines read or write it)</text>
<line x1="360" y1="213" x2="428" y2="213" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="372" y="206" font-size="13">yes</text>
<rect x="430" y="180" width="340" height="66" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
<text x="600" y="209" text-anchor="middle" font-weight="bold">sync.Mutex</text>
<text x="600" y="227" text-anchor="middle">Many readers, few writers: sync.RWMutex</text>
<line x1="200" y1="246" x2="200" y2="268" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="262" font-size="13">no</text>
<rect x="40" y="270" width="320" height="66" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="200" y="308" text-anchor="middle">Just one counter or one flag?</text>
<line x1="360" y1="303" x2="428" y2="303" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="372" y="296" font-size="13">yes</text>
<rect x="430" y="270" width="340" height="66" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
<text x="600" y="299" text-anchor="middle" font-weight="bold">sync/atomic</text>
<text x="600" y="317" text-anchor="middle">atomic.Int64, atomic.Bool: no lock needed</text>
<line x1="200" y1="336" x2="200" y2="358" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="352" font-size="13">no</text>
<rect x="40" y="360" width="320" height="66" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="200" y="398" text-anchor="middle">Wait for goroutines to finish?</text>
<line x1="360" y1="393" x2="428" y2="393" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="372" y="386" font-size="13">yes</text>
<rect x="430" y="360" width="340" height="66" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
<text x="600" y="380" text-anchor="middle" font-weight="bold">sync.WaitGroup (Go 1.25 has wg.Go)</text>
<text x="600" y="398" text-anchor="middle">Need first error and cancel?</text>
<text x="600" y="416" text-anchor="middle">errgroup (golang.org/x/sync, not stdlib)</text>
<line x1="200" y1="426" x2="200" y2="448" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="442" font-size="13">no</text>
<rect x="40" y="450" width="320" height="66" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="200" y="480" text-anchor="middle">Cancel, set a deadline, or carry</text>
<text x="200" y="500" text-anchor="middle">request-scoped data?</text>
<line x1="360" y1="483" x2="428" y2="483" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="372" y="476" font-size="13">yes</text>
<rect x="430" y="450" width="340" height="66" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
<text x="600" y="479" text-anchor="middle" font-weight="bold">context</text>
<text x="600" y="497" text-anchor="middle">Pass ctx as first arg; check ctx.Done()</text>
<line x1="200" y1="516" x2="200" y2="538" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="532" font-size="13">no</text>
<rect x="40" y="540" width="320" height="66" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="200" y="578" text-anchor="middle">Limit how many run at once?</text>
<line x1="360" y1="573" x2="428" y2="573" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="372" y="566" font-size="13">yes</text>
<rect x="430" y="540" width="340" height="66" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
<text x="600" y="560" text-anchor="middle" font-weight="bold">Worker pool</text>
<text x="600" y="578" text-anchor="middle">N goroutines on one jobs channel</text>
<text x="600" y="596" text-anchor="middle">or a buffered-channel semaphore</text>
<line x1="200" y1="606" x2="200" y2="628" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="622" font-size="13">no</text>
<rect x="40" y="630" width="320" height="66" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="200" y="668" text-anchor="middle">Run something exactly once?</text>
<line x1="360" y1="663" x2="428" y2="663" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="372" y="656" font-size="13">yes</text>
<rect x="430" y="630" width="340" height="66" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
<text x="600" y="659" text-anchor="middle" font-weight="bold">sync.Once</text>
<text x="600" y="677" text-anchor="middle">or sync.OnceFunc / sync.OnceValue</text>
<line x1="200" y1="696" x2="200" y2="718" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="712" font-size="13">no</text>
<rect x="40" y="720" width="320" height="66" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="200" y="750" text-anchor="middle">Reuse temporary objects to cut</text>
<text x="200" y="770" text-anchor="middle">allocations?</text>
<line x1="360" y1="753" x2="428" y2="753" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="372" y="746" font-size="13">yes</text>
<rect x="430" y="720" width="340" height="66" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
<text x="600" y="749" text-anchor="middle" font-weight="bold">sync.Pool</text>
<text x="600" y="767" text-anchor="middle">Items may be dropped at any GC</text>
<line x1="200" y1="786" x2="200" y2="808" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="802" font-size="13">no</text>
<rect x="40" y="810" width="320" height="66" rx="8" fill="#E8F1FF" stroke="#2F6FDE" stroke-width="2"/>
<text x="200" y="848" text-anchor="middle">Wait on many things, or time out?</text>
<line x1="360" y1="843" x2="428" y2="843" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="372" y="836" font-size="13">yes</text>
<rect x="430" y="810" width="340" height="66" rx="8" fill="#E3F6E5" stroke="#2E9E44" stroke-width="2"/>
<text x="600" y="839" text-anchor="middle" font-weight="bold">select</text>
<text x="600" y="857" text-anchor="middle">case &lt;-ctx.Done() / &lt;-time.After(d)</text>
<rect x="40" y="902" width="730" height="80" rx="8" fill="#FDE7E7" stroke="#D13B3B" stroke-width="2"/>
<text x="405" y="930" text-anchor="middle" font-weight="bold" font-size="16">Always</text>
<text x="405" y="954" text-anchor="middle">Every goroutine needs a way to stop. The owner closes channels.</text>
<text x="405" y="972" text-anchor="middle">Run your tests with go test -race.</text>
</svg>
